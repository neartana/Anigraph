<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smoke-fixture</title>
</head>
<body>
<h1>fixture</h1>
<ul id="log"></ul>
<script>
  window.__ev = [];
  window.__fetchStatus = null;
  var record = function (type, extra) {
    var entry = Object.assign({ t: type }, extra || {});
    window.__ev.push(entry);
    var li = document.createElement('li');
    li.textContent = type;
    document.getElementById('log').append(li);
  };
  ['pointerdown', 'pointermove', 'pointerup', 'mousedown', 'mousemove', 'mouseup'].forEach(function (type) {
    window.addEventListener(type, function (event) { record(type, { x: event.clientX, y: event.clientY }); });
  });
  ['touchstart', 'touchmove', 'touchend'].forEach(function (type) {
    window.addEventListener(type, function (event) {
      var touch = event.touches[0] || event.changedTouches[0] || { clientX: 0, clientY: 0 };
      record(type, { x: touch.clientX, y: touch.clientY });
    }, { passive: true });
  });
  window.addEventListener('keydown', function (event) { record('keydown', { key: event.key }); });
  fetch('/fixture.json')
    .then(function (response) { return response.text().then(function (body) { window.__fetchStatus = { status: response.status, body: body }; }); })
    .catch(function (error) { window.__fetchStatus = { error: String(error) }; });
</script>
</body>
</html>
